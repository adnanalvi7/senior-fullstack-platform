services:
  db:
    image: postgres:16-alpine
    container_name: capex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capex_db}
      POSTGRES_USER: ${POSTGRES_USER:-capex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capex_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capex_user} -d ${POSTGRES_DB:-capex_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capex_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capex_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_db --orgs 8 --projects-per-org 1000 &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-capex-platform-production-grade-key-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-capex_db}
      POSTGRES_USER: ${POSTGRES_USER:-capex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capex_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capex_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-capex-platform-production-grade-key-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-capex_db}
      POSTGRES_USER: ${POSTGRES_USER:-capex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capex_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # Periodic outbox sweep: recomputes any rollup bucket whose refresh task was lost.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capex_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-capex-platform-production-grade-key-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-capex_db}
      POSTGRES_USER: ${POSTGRES_USER:-capex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capex_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capex_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
